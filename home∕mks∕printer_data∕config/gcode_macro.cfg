        M118 Найден пластик: {profile.filament|trim} ({profile.type}), сопло {target_hotend}C
    {% endif %}

[gcode_macro TEST_Z_STRIPES]
description: Калибровка Z-offset квадратной спиралью Архимеда из центра стола с определением пластика
gcode:
    {% if params.HOTEND is not defined and params.BED is not defined and params.FILAMENT is not defined %}
        DETECT_FILAMENT
    {% endif %}
    _TEST_Z_STRIPES_RUN {% if params.HOTEND is defined %}HOTEND={params.HOTEND}{% endif %} {% if params.BED is defined %}BED={params.BED}{% endif %} {% if params.FILAMENT is defined %}FILAMENT="{params.FILAMENT}"{% endif %} {% if params.TYPE is defined %}TYPE={params.TYPE}{% endif %}

[gcode_macro _TEST_Z_STRIPES_RUN]
gcode:
    {% set state = printer["gcode_macro _detect_filament_state"] %}
    {% set svv = printer.save_variables.variables %}

    {% set target_hotend = params.HOTEND|default(state.target_hotend)|int %}
    {% if target_hotend <= 0 %}
        {% set target_hotend = printer.extruder.target|int %}
    {% endif %}
    {% if target_hotend <= 0 %}
        {% set target_hotend = 210 %}
    {% endif %}

    {% set target_bed = params.BED|default(params.BED_TEMP)|default(printer.heater_bed.target)|int %}
    {% if target_bed <= 0 %}
        {% set target_bed = svv.bed_temp|default(60)|int %}
    {% endif %}

    {% set filament_name = params.FILAMENT|default(params.MATERIAL)|default(state.filament)|default("Manual Filament")|trim %}
    {% set material_type = params.TYPE|default(state.material_type)|default("CUSTOM")|trim %}

    {% set z_step     = 0.01 %}
    {% set step       = 5 %}
    {% set flow       = 0.035 %}
    {% set center_x   = printer.toolhead.axis_maximum.x / 2 %}
    {% set center_y   = printer.toolhead.axis_maximum.y / 2 %}
    {% set probe_temp = 140 %}

    M118 --- Старт калибровки Z-offset (квадратная спираль Архимеда из центра) ---
    M118 Пластик {filament_name} ({material_type}): сопло={target_hotend}C, стол={target_bed}C
    BED_MESH_CLEAR
    set_zoffset

    M118 Греем стол до {target_bed}C и сопло до {probe_temp}C для калибровки датчика...
    M140 S{target_bed}
    M104 S{probe_temp}
    M190 S{target_bed}
    M109 S{probe_temp}

    M118 Поиск начала координат Z...
    G28
    get_zoffset

    M118 Пробирование по центру стола...
    G1 X{center_x - printer.probe["x_offset"]} Y{center_y - printer.probe["y_offset"]} F9000
    G1 Z10 F600
    probe
    SAVE_Z_OFFSET_TO_BED_MESH
    G1 Z10 F600

    M118 Догреваем сопло до {target_hotend}C для {filament_name}...
    M104 S{target_hotend}
    M109 S{target_hotend}

    M118 Первоначальная прочистка сопла...
    CLEAR_NOZZLE_FAST HOTEND={target_hotend} PURGE_LENGTH=25

    M118 Финальный нагрев сопла до {target_hotend}C перед печатью...
    M109 S{target_hotend}
    M83 ; Относительная экструзия

    {% set mid_index = 6 %}
    {% set max_index = 11 %}

    # --- Фаза 1: Печать от среднего витка НАРУЖУ с увеличением Z-offset (Z+) ---
    M118 --- Фаза 1: Печать от среднего витка наружу (Z вверх) ---
    {% for i in range(mid_index, max_index + 1) %}
        {% set d = i * step %}
        {% set shift_out = (i - mid_index) * z_step %}

        {% if i > mid_index %}
            M118 Виток #{i} (наружу): Z-offset = +{shift_out|round(3)} мм
            SET_GCODE_OFFSET Z_ADJUST={z_step} MOVE=1
        {% else %}
            M118 Виток #{i} (средний): калиброванный нуль (+0.00 мм)
        {% endif %}

        # Переход к началу витка
        G90
        G1 Z5 F900
        G1 X{center_x + d} Y{center_y - d} F9000
        G1 Z0.2 F600
        G1 E1.0 F1800

        # Замкнутый квадратный виток вокруг центра
        G1 X{center_x + d} Y{center_y + d} E{2 * d * flow} F1200
        G1 X{center_x - d} Y{center_y + d} E{2 * d * flow} F1200
        G1 X{center_x - d} Y{center_y - d} E{2 * d * flow} F1200
        G1 X{center_x + d} Y{center_y - d} E{2 * d * flow} F1200
        G1 E-1.0 F1800
    {% endfor %}

    # --- Сброс Z-offset в 0 перед началом движения ВНУТРЬ ---
    SET_GCODE_OFFSET Z=0 MOVE=1

    M118 Очистка сопла (wipe) без продавливания пластика...
    CLEAR_NOZZLE_FAST HOTEND={target_hotend} PURGE_LENGTH=0
    M109 S{target_hotend}

    # --- Фаза 2: Смещение к центру и печать витков ВНУТРЬ с уменьшением Z-offset (Z-) ---
    M118 --- Фаза 2: Печать от среднего витка внутрь к центру (Z вниз) ---
    {% for i in range(mid_index - 1, 0, -1) %}
        {% set d = i * step %}
        {% set shift_in = (i - mid_index) * z_step %}

        M118 Виток #{i} (внутрь): Z-offset = {shift_in|round(3)} мм
        SET_GCODE_OFFSET Z_ADJUST=-{z_step} MOVE=1

        # Переход к началу внутреннего витка
        G90
        G1 Z5 F900
        G1 X{center_x + d} Y{center_y - d} F9000
        G1 Z0.2 F600
        G1 E1.0 F1800

        # Замкнутый квадратный виток вокруг центра
        G1 X{center_x + d} Y{center_y + d} E{2 * d * flow} F1200
        G1 X{center_x - d} Y{center_y + d} E{2 * d * flow} F1200
        G1 X{center_x - d} Y{center_y - d} E{2 * d * flow} F1200
        G1 X{center_x + d} Y{center_y - d} E{2 * d * flow} F1200
        G1 E-1.0 F1800
    {% endfor %}

    G90
    G1 Z30 F600
    G1 X10 Y10 F9000
    M104 S0
    M140 S0
    M84
    M118 Калибровка завершена!

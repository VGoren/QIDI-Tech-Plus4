    SET_PIN PIN=sound VALUE=1
    
[gcode_macro beep_off]
gcode:
    SET_PIN PIN=sound VALUE=0

[gcode_arcs]
resolution: 1.0

[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}
    {% endif %}

[exclude_object]

[gcode_macro G31]
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=1

[gcode_macro G32]
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=0

[gcode_macro G29]
variable_k:1
gcode:
    {% set temp = printer["heater_generic chamber"].target %}
    M141 S0
    {% if temp > 0 %}
        G4 P15000
    {% endif %}
    BED_MESH_CLEAR
    {% if k|int==1 %}
        G28   
        get_zoffset
        M141 S{temp}
        G1 X{150 - printer.probe["x_offset"]} Y{150 - printer.probe["y_offset"]} F9000
        G1 Z10 F600
        probe
        SAVE_Z_OFFSET_TO_BED_MESH
        G1 z10 F600
        BED_MESH_CALIBRATE PROFILE=kamp
        SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
        G4 P5000
        SAVE_CONFIG_QD
    {% else %}
        g28
        get_zoffset
        {% if printer["bed_mesh"].profiles.default %}
            BED_MESH_PROFILE LOAD=default
            SAVE_VARIABLE VARIABLE=profile_name VALUE='"default"'
        {% else %}
            G1 X{150 - printer.probe["x_offset"]} Y{150 - printer.probe["y_offset"]} F9000
            G1 Z10 F600
            probe
            SAVE_Z_OFFSET_TO_BED_MESH
            G1 z10 F600
            _BED_MESH_CALIBRATE PROFILE=default
            G4 P5000
            SAVE_CONFIG_QD
        {% endif %}
    {% endif %}

[gcode_macro M204]
rename_existing: M99204
gcode:
    {% if params.S is defined %}
        {% set s = params.S|float %}
    {% endif %}
    {% if params.P is defined %}
    {% if params.T is defined %}
        {% set s = [params.P|float ,params.T|float] | min %}
    {% endif %}
    {% endif %}

    SET_VELOCITY_LIMIT ACCEL={s}
    SET_VELOCITY_LIMIT ACCEL_TO_DECEL={s/2}

[gcode_macro Z_VIBRATE]
gcode:
    m204 S400
    G90
    G0 Z4
    G91
   #G4 P3000
     SET_PIN PIN=ctlyd VALUE=1 
    {% for z in range(1,50) %}
        G1 Z1 F1200
#        G4 P50
        G1 Z-1 F1200
#       G4 P50
    {% endfor %}
    M204 S100
    SET_PIN PIN=ctlyd VALUE=0
    G4 P1000
    G1 Z4
    G90

[gcode_macro CLEAR_NOZZLE_FAST]
description: Быстрая и экономная прочистка сопла (в 2.5 раза меньше выдавливания пластика)
gcode:
    {% if params.HOTEND is not defined %}
        DETECT_FILAMENT
    {% endif %}
    _CLEAR_NOZZLE_PARAMETRIZED_RUN {% if params.HOTEND is defined %}HOTEND={params.HOTEND}{% endif %} {% if params.PURGE_LENGTH is defined %}PURGE_LENGTH={params.PURGE_LENGTH}{% endif %}

[gcode_macro _CLEAR_NOZZLE_PARAMETRIZED_RUN]
gcode:
    _CG28 ; Автоматическая парковка осей, если принтер еще не сдомался

    {% set state = printer["gcode_macro _detect_filament_state"] %}
    {% set target_hotend = params.HOTEND|default(state.target_hotend|default(0))|int %}
    {% if target_hotend == 0 %}
        {% set target_hotend = printer.extruder.target|int %}
    {% endif %}
    {% if target_hotend == 0 %}
        {% set target_hotend = 255 %}
    {% endif %}

    {% set purge_len = params.PURGE_LENGTH|default(30)|int %}

    G90
    {% if (printer.gcode_move.position.z) < 35 %}
        G1 Z35 F900
    {% else %}
        G91
        G1 Z5 F900
        G90
    {% endif %}

    # Выход к лотку
    G1 X56 F12000
    G1 Y310 F12000
    G1 Y324 F600
    G1 X95 F600
    M400

    # Доведение температуры
    M109 S{target_hotend}

    # Прочистка (если purge_len > 0, то выдавливаем, если 0 — пропускаем выдавливание и только протираем)
    {% if purge_len > 0 %}
        G92 E0
        G1 E5 F50
        G92 E0
        G1 E{purge_len} F300
        G92 E0
        G1 E-2 F200
    {% endif %}

    # Обдув
    M106 S255
    G4 P2000
    M104 S140
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y308 F30000
    G1 Y324 F600
    G1 X124 E-1 F1000

    # 1. Очистка об силиконовый скребок (X58..78, Y321.5..324)
    G1 X95 F12000
    G1 Y314 F9000
    G1 Y324 F600
    G1 X58 F12000
    G1 X78 F12000
    G1 Y324
    G1 X58 F12000
    G1 X78 F12000
    G1 Y323.5
    G1 X58 F12000
    G1 X78 F12000
    G1 Y323
    G1 X58 F12000
    G1 X78 F12000
    G1 Y322.5
    G1 X58 F12000
    G1 X78 F12000
    G1 Y322
    G1 X58 F12000
    G1 X75 F12000
    G1 Y321.5
    G2 I0.8 J0.8 F600
    G2 I0.8 J0.8 F600
    G1 Y324 F600

    # 2. Очистка об стальной скребок (X113..133, Y319..324)
    G1 X133 F12000
    G1 Y321 F12000
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 Y319 F300
    G1 X132
    G1 Y324
    G1 X131
    G1 Y319
    G1 X130
    G1 Y324
    G1 X129
    G1 Y319

    G1 X113 F400
    G1 Y320
    G1 X125
    G1 X113
    G1 X125
    G2 I0.5 J0.5 F400
    G2 I0.5 J0.5 F400

    G1 Y300 F9000
    M106 S0
    M400
    M118 Nozzle cleared (fast)

